# Nada aqui depende do ambiente. Em produção, a conexão com o banco vem das
# variáveis SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME e
# SPRING_DATASOURCE_PASSWORD (ADR 0008). No computador, vem do perfil local
# (application-local.yaml).
spring:
  application:
    name: recepcia
  jpa:
    open-in-view: false
    hibernate:
      # A estrutura do banco é do Flyway. O Hibernate só confere se as entidades batem com ela.
      ddl-auto: validate
