# Integração contínua (ADR 0012 e ADR 0013). A regra "Proteção da main" exige que
# os quatro primeiros jobs passem antes do merge.
name: Integração contínua

on:
  pull_request:
  push:
    branches: [main]

# Num PR, um push novo cancela a execução anterior. Na main, toda execução vai até o fim.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Testes, com o PostgreSQL do Testcontainers, cobertura e o .jar com o painel dentro.
      - run: ./mvnw --batch-mode --no-transfer-progress verify
        working-directory: backend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cobertura-backend
          path: backend/target/site/jacoco

  painel:
    name: Painel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cobertura-painel
          path: frontend/coverage/recepcia

  segredos:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Todo o histórico: um segredo apagado num commit continua nos anteriores.
          fetch-depth: 0
      - run: >-
          docker run --rm --volume "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose --no-banner

  semgrep:
    name: Segurança do código (Semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.178.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config p/default --metrics=off --error

  # Depois de cada merge, atualiza os selos de cobertura do README na branch badges.
  selos:
    name: Selos de cobertura
    if: github.event_name == 'push'
    needs: [backend, painel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: cobertura
      # Cor neutra de propósito: não há porcentagem mínima (ADR 0012).
      - name: Gera os selos
        run: |
          backend=$(awk -F, 'NR > 1 { missed += $8; covered += $9 } END { printf "%d", covered * 100 / (missed + covered) }' cobertura/cobertura-backend/jacoco.csv)
          painel=$(jq '.total.lines.pct | floor' cobertura/cobertura-painel/coverage-summary.json)
          mkdir selos
          curl --fail --silent --show-error --output selos/cobertura-backend.svg "https://img.shields.io/badge/cobertura_do_backend-${backend}%25-blue"
          curl --fail --silent --show-error --output selos/cobertura-painel.svg "https://img.shields.io/badge/cobertura_do_painel-${painel}%25-blue"
      - name: Publica os selos
        working-directory: selos
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init --quiet --initial-branch=badges
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --quiet --message "chore: atualiza os selos de cobertura"
          git push --force --quiet "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" badges
