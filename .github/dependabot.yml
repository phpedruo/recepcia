# As actions do workflow ficam fixadas pelo hash do commit (ADR 0013). O Dependabot
# abre um PR por mês, com todas as atualizações juntas.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Só propõe versões publicadas há pelo menos 7 dias, para dar tempo de uma versão
    # maliciosa ser descoberta e retirada.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: build
    labels: [infra]
